name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect rebuild-relevant changes
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.filter.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rebuild:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'

  test:
    name: Typecheck, lint, unit tests & Firefox lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The same validator AMO runs on upload: fails on errors, not warnings
      # (bundled React trips two known UNSAFE_VAR_ASSIGNMENT warnings).
      - name: Firefox add-on lint (web-ext)
        run: npm run lint:firefox

  e2e:
    name: E2E tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build & package
    needs: [test, e2e, changes]
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome build
        run: ./scripts/package-chrome.sh

      - name: Package Firefox build
        run: ./scripts/package-firefox.sh

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkding-toolbar-companion-chrome
          path: linkding-toolbar-companion-chrome.zip
          retention-days: 14

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkding-toolbar-companion-firefox
          path: linkding-toolbar-companion-firefox.zip
          retention-days: 14

  release:
    name: Release
    needs: [changes, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Chrome artifact
        if: steps.check.outputs.already_released == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linkding-toolbar-companion-chrome

      - name: Download Firefox artifact
        if: steps.check.outputs.already_released == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linkding-toolbar-companion-firefox

      - name: Create GitHub release
        if: steps.check.outputs.already_released == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            linkding-toolbar-companion-chrome.zip
            linkding-toolbar-companion-firefox.zip

      - name: Skip notice
        if: steps.check.outputs.already_released == 'true'
        run: echo "v${{ steps.version.outputs.version }} is already released -- bump package.json's version to publish a new release."
